name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0"
        required: true
        type: string
      dry_run:
        description: "JReleaser dry-run (no deploy)"
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test
        run: ./gradlew build

      - name: Resolve release meta
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            DRY_RUN="false"
          else
            VERSION="${{ inputs.version }}"
            DRY_RUN="${{ inputs.dry_run }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "event=${{ github.event_name }} version=${VERSION} dry_run=${DRY_RUN}"

      - name: Set release version
        run: |
          sed -i.bak "s/^version=.*/version=${{ steps.meta.outputs.version }}/" gradle.properties
          rm -f gradle.properties.bak
          cat gradle.properties

      - name: Stage Maven artifacts
        run: ./gradlew publish

      - name: Show staged artifacts
        run: find build/staging-deploy -type f | sort

      - name: Deploy with JReleaser
        env:
          JRELEASER_DRY_RUN: ${{ inputs.dry_run }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_TOKEN: ${{ secrets.JRELEASER_MAVENCENTRAL_TOKEN }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GENERIC_TOKEN: unused
        run: ./gradlew jreleaserFullRelease

      - name: Upload JReleaser output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-output
          path: |
            build/jreleaser/
            out/jreleaser/
          if-no-files-found: ignore
